name: Prototype checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests
      - run: node --check public/app.js && node --check public/interactions.js && node --check api/events.js
      - run: npm ci
      - run: npm run build
